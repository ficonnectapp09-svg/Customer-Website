name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST || secrets.DEPLOY_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/var/www/Connect-App-/backend' }} || cd /home/ubuntu/Connect-App-/backend
            git pull origin main
            npm install
            npm run build
            pm2 restart connect-backend || pm2 restart connect-app-backend
            pm2 save
